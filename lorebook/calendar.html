---
layout: default
title: Calendar
permalink: /lorebook/calendar/
---
<section class="main-content page-lore" style="padding-top: 100px; min-height: 80vh;">
    <div class="content-container" style="max-width: 1000px; margin: 0 auto;">
        
        <div class="lore-header" style="margin-bottom: 40px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 20px;">
            <h1 style="color: #fff; font-size: 2.5rem; margin-bottom: 10px;"><span style="color: var(--accent-color);">📅</span> 도서관 달력</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">사계절의 변화, 축제 일정표와 제철 작물 및 어종 정보를 열람하세요.</p>
        </div>

        <div class="guide-content" style="background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <!-- Calendar Section -->
            <div id="calendar" class="guide-section">
                
                <style>
                    .cal-tab { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #888; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: all 0.3s ease; }
                    .cal-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
                    .cal-tab.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); box-shadow: 0 4px 15px rgba(252, 163, 17, 0.3); }
                    .cal-cell { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; min-height: 80px; position: relative; transition: all 0.2s; cursor: pointer; }
                    .cal-cell:hover { background: rgba(252, 163, 17, 0.1); border-color: var(--accent-color); transform: translateY(-3px); }
                    .cal-day-num { position: absolute; top: 8px; left: 10px; color: #fff; font-weight: bold; font-size: 1.1rem; }
                    .cal-event-badge { display: block; font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; margin-top: 25px; margin-bottom: 3px; font-weight: bold; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
                    .badge-bday { background: #9b59b6; color: #fff; }
                    .badge-fest { background: #e74c3c; color: #fff; }
                    .badge-zodiac { background: #3498db; color: #fff; }
                    
                    /* Tooltip Animation */
                    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                </style>

                <!-- 캘린더 탭 -->
                <div class="calendar-tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="cal-tab active" data-season="Spring">🌸 봄</button>
                    <button class="cal-tab" data-season="Summer">☀️ 여름</button>
                    <button class="cal-tab" data-season="Fall">🍂 가을</button>
                    <button class="cal-tab" data-season="Winter">❄️ 겨울</button>
                </div>
                
                <!-- 캘린더 본문 컨테이너 -->
                <div id="calendar-container" style="background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); padding: 20px;">
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 10px; text-align: center; color: var(--text-muted); font-weight: bold;">
                        <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div>
                    </div>
                    <div class="cal-grid" id="cal-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;"></div>
                </div>

                <!-- 이벤트 정보 패널 -->
                <div id="cal-event-panel" style="margin-top: 20px; padding: 20px; background: rgba(252, 163, 17, 0.05); border-left: 4px solid var(--accent-color); border-radius: 4px; display: none; animation: fadeIn 0.3s ease-out;">
                    <h3 id="event-title" style="color: var(--accent-color); margin-bottom: 10px; font-size: 1.2rem;"></h3>
                    <p id="event-desc" style="color: #fff; line-height: 1.6; font-size: 1rem;"></p>
                </div>
                
                <!-- 시즌별 작물/물고기 정보 -->
                <div class="season-info" style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div style="background: var(--bg-dark); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                        <h4 style="color: var(--accent-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">🌾 이번 계절의 작물</h4>
                        <ul id="season-crops" style="color: var(--text-muted); list-style: none; padding-left: 0; line-height: 2;"></ul>
                    </div>
                    <div style="background: var(--bg-dark); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                        <h4 style="color: var(--accent-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">🎣 이번 계절의 어종</h4>
                        <ul id="season-fishes" style="color: var(--text-muted); list-style: none; padding-left: 0; line-height: 2;"></ul>
                    </div>
                </div>

            </div>

        </div>
    </div>
</section>

<!-- 캘린더 로직 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const calEvents = {{ site.data.calendar_events | jsonify }};
        const cropsData = {{ site.data.crops | jsonify }};
        const fishesData = {{ site.data.fishes | jsonify }};

        const calTabs = document.querySelectorAll('.cal-tab');
        const calGrid = document.getElementById('cal-grid');
        const eventPanel = document.getElementById('cal-event-panel');
        const eventTitle = document.getElementById('event-title');
        const eventDesc = document.getElementById('event-desc');
        
        const cropsList = document.getElementById('season-crops');
        const fishesList = document.getElementById('season-fishes');

        function renderCalendar(season) {
            calGrid.innerHTML = '';
            eventPanel.style.display = 'none';

            const seasonEvents = calEvents.filter(e => e.season === season);
            
            for(let i = 1; i <= 28; i++) {
                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                
                const numStr = document.createElement('span');
                numStr.className = 'cal-day-num';
                numStr.innerText = i;
                cell.appendChild(numStr);

                const daysEvents = seasonEvents.filter(e => e.day === i);
                let htmlEvents = '';
                
                daysEvents.forEach(ev => {
                    let badgeClass = '';
                    if(ev.type === 'birthday') badgeClass = 'badge-bday';
                    else if(ev.type === 'festival') badgeClass = 'badge-fest';
                    else if(ev.type === 'zodiac') badgeClass = 'badge-zodiac';

                    htmlEvents += `<span class="cal-event-badge ${badgeClass}">${ev.name}</span>`;
                });
                
                if(htmlEvents !== '') {
                    cell.insertAdjacentHTML('beforeend', htmlEvents);
                }

                cell.addEventListener('click', () => {
                    if(daysEvents.length > 0) {
                        eventTitle.innerHTML = `📅 ${season} ${i}일의 주요 일정`;
                        let descHtml = '';
                        daysEvents.forEach(ev => {
                            descHtml += `<strong>[${ev.name}]</strong><br>${ev.desc.replace(/\n/g, '<br>')}<br><br>`;
                        });
                        eventDesc.innerHTML = descHtml;
                        eventPanel.style.display = 'block';
                        
                        eventPanel.style.animation = 'none';
                        eventPanel.offsetHeight;
                        eventPanel.style.animation = null;
                    } else {
                        eventTitle.innerHTML = `📅 ${season} ${i}일`;
                        eventDesc.innerHTML = '특별한 일정이 없습니다.';
                        eventPanel.style.display = 'block';
                    }
                });

                calGrid.appendChild(cell);
            }

            cropsList.innerHTML = '';
            fishesList.innerHTML = '';
            
            const seasonCrops = cropsData.filter(c => c.Season && c.Season.includes(season));
            if(seasonCrops.length > 0) {
                seasonCrops.forEach(c => {
                    if (c.DisplayName && c.DisplayName.trim() !== '') {
                        cropsList.innerHTML += `<li>🌱 <strong style="color:#fff;">${c.DisplayName}</strong> <span style="font-size:0.85em;">(${c.MinHarvestAmount}~${c.MaxHarvestAmount}개 수확)</span></li>`;
                    }
                });
            } else {
                cropsList.innerHTML = '<li>이번 계절에 자라는 주요 작물이 없습니다.</li>';
            }

            const seasonFishes = fishesData.filter(f => f.Season && (f.Season.includes(season) || f.Season.includes('All')));
            if(seasonFishes.length > 0) {
                seasonFishes.forEach(f => {
                    if (f.DisplayName && f.DisplayName.trim() !== '') {
                        fishesList.innerHTML += `<li>🐟 <strong style="color:#fff;">${f.DisplayName}</strong></li>`;
                    }
                });
            } else {
                fishesList.innerHTML = '<li>이번 계절에 낚이는 주요 물고기가 없습니다.</li>';
            }
        }

        calTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                calTabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                renderCalendar(e.target.getAttribute('data-season'));
            });
        });

        renderCalendar('Spring');
    });
</script>
